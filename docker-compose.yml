# LocalStack for the envs/localstack environment.
#
#   cp .env.example .env        # then put your auth token in .env
#   docker compose up -d --wait # start and wait until healthy
#   docker compose down         # stop (LocalStack state is thrown away)
#
# Since release 2026.03 LocalStack needs a (free, non-commercial "Hobby")
# account token to start. Compose refuses to run without one.

services:
  localstack:
    container_name: localstack
    # Pinned on purpose: "latest" has broken setups before (e.g. the 2026.03
    # auth change). Bump deliberately, e.g. LOCALSTACK_VERSION=2026.09.0.
    image: localstack/localstack:${LOCALSTACK_VERSION:-2026.08.0}
    ports:
      - "127.0.0.1:4566:4566" # only reachable from this machine, not your LAN
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN in .env - free Hobby account at https://app.localstack.cloud}
      # Only start what envs/localstack uses: faster startup, less memory.
      SERVICES: ec2,iam,sts
      # "mock" = EC2 instances are API records only: fast and deterministic,
      # ideal for CI. "docker" = each instance is a real container (slower).
      EC2_VM_MANAGER: ${EC2_VM_MANAGER:-mock}
      DEBUG: ${DEBUG:-0}
    volumes:
      # Needed only by the "docker" EC2 VM manager.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
